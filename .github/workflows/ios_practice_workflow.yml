name: iOS Practice workflow

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout 🔰
        uses: actions/checkout@v7
      - name: Build 🛠️
        run: |
          xcodebuild build -quiet -project PracticeProject.xcodeproj -scheme iOSPractice -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Test 📲
        run: |
          xcodebuild test -quiet -project PracticeProject.xcodeproj -scheme iOSPractice -destination 'platform=iOS Simulator,name=iPhone 17'

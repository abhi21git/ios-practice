name: iOS Practice workflow

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout 🔰
        uses: actions/checkout@v7
      - name: Build 🛠️
        run: |
          xcodebuild build-for-testing -quiet -project PracticeProject.xcodeproj -scheme iOSPractice -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: Test 📲
        run: |
          xcodebuild test-without-building -quiet -project PracticeProject.xcodeproj -scheme iOSPractice -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath DerivedData
